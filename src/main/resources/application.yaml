server:
  port: 8081
spring:
  application:
    name: chat-buddy
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b
      embedding:
        model: mxbai-embed-large
  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://localhost:5431/ragdb
    username: postgres
    password: postgres
  main:
    allow-circular-references: true

logging:
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %red([%thread]) %blue(%-5level) %yellow(%logger{36}) - %msg%n"
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
    com.alex: INFO